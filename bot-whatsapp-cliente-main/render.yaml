services:
  - type: web
    name: bot-whatsapp-painel
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PANEL_EMAIL
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: KEEP_ALIVE_URL
        sync: false
      - key: BOT_PHONE_NUMBER
        sync: false
    disk:
      name: bot-whatsapp-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
