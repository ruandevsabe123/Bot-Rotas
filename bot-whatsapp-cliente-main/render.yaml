services:
  - type: web
    name: bot-whatsapp-painel
    env: docker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PANEL_USERS
        sync: false
      - key: PANEL_ADMIN_EMAILS
        sync: false
      - key: PANEL_SESSION_SECRET
        sync: false
      - key: KEEP_ALIVE_URL
        sync: false
      - key: BOT_PHONE_NUMBER
        sync: false
    disk:
      name: bot-whatsapp-data
      mountPath: /data
      sizeGB: 1
